<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TikTaac prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Dots&family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,600;6..12,700&family=Kanit:wght@900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#161619; --ink:#FFFFFF; --muted:#A2A2A3; --line:#454547; --soft:rgba(255,251,251,.2);
  --panel:#1F1F23; --panel2:#26262B; --accent:#FFFFFF;
  --display:'Zen Dots',system-ui,sans-serif; --body:'Nunito Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0B0B0D;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
::selection{background:#fff;color:#161619}

/* stage: framed phone on wide screens, full-bleed when embedded or on phones */
.stage{height:100%;min-height:0;display:flex;align-items:center;justify-content:center;gap:48px;padding:20px 16px;box-sizing:border-box;overflow:hidden}
/* the phone keeps its real 390x844 layout and is scaled down to fit the window */
.devwrap{flex:none;width:calc(390px * var(--s,1));height:calc(844px * var(--s,1))}
.devwrap .device{transform:scale(var(--s,1));transform-origin:top left}
.embed .devwrap{width:100%;height:100%}
.embed .devwrap .device{transform:none}
.device{position:relative;width:390px;height:844px;border-radius:54px;padding:12px;background:#000;box-shadow:0 0 0 1.5px #2a2a2e,0 40px 80px rgba(0,0,0,.6)}
.screen{position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;background:var(--bg)}
.embed .stage{padding:0;display:block;min-height:0;height:100%}
.embed .device{width:100%;height:100%;border-radius:0;padding:0;box-shadow:none;background:var(--bg)}
.embed .screen{border-radius:0}
.embed .aside{display:none}
@media (max-width:520px){.devwrap{width:100%;height:100%}.devwrap .device{transform:none}.stage{padding:0;display:block;height:100%}.device{width:100%;height:100%;border-radius:0;padding:0;box-shadow:none}.screen{border-radius:0}.aside{display:none}}
.aside{max-width:280px;color:var(--muted);font-size:14px;line-height:1.55}
.aside h1{font-family:var(--display);font-weight:400;color:#fff;font-size:28px;line-height:1.1;margin:0 0 14px}
.aside ol{padding-left:18px;margin:14px 0 0}.aside li{margin:6px 0}
.aside .role{display:flex;gap:6px;margin-top:22px}
.chipbtn{border:1px solid var(--line);border-radius:100px;padding:9px 16px;font-size:14px;color:var(--muted);transition:all .2s}
.chipbtn.on{background:#fff;color:var(--bg);border-color:#fff}

/* app chrome */
.status{position:absolute;top:0;left:0;right:0;height:44px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 32px;font-size:15px;font-weight:600;z-index:30;pointer-events:none}
.status .ind{display:flex;gap:6px;align-items:center}
.embed .status{display:none}
.scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-top:44px}
.embed .scroller{padding-top:0}
.scroller::-webkit-scrollbar{display:none}
.hdr{position:sticky;top:0;z-index:20;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:linear-gradient(var(--bg) 70%,rgba(22,22,25,0))}
.logo{display:flex;align-items:center;gap:7px;font-family:'Kanit',sans-serif;font-weight:900;font-size:21px;letter-spacing:.01em}
.hdr .icons{display:flex;gap:4px}
.ibtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;transition:background .2s}
.ibtn:hover{background:rgba(255,255,255,.06)}
.view{animation:enter .38s cubic-bezier(.22,1,.36,1)}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}}

/* type */
.d1{font-family:var(--display);font-weight:400;font-size:48px;line-height:1;margin:0;letter-spacing:-.01em}
.d2{font-family:var(--display);font-weight:400;font-size:32px;line-height:1.1;margin:0}
.d3{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1;margin:0}
.p{font-size:14px;line-height:1.3;color:var(--muted);margin:0}
.p16{font-size:16px;line-height:1.25;color:var(--muted);margin:0}
.meta{font-size:12px;font-weight:300;letter-spacing:.25em;color:var(--muted);text-transform:uppercase}
.pad{padding:0 16px}
.sec{padding:56px 16px 0}
.sec>.d2{margin-bottom:16px}

/* controls */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border-radius:100px;background:#fff;color:var(--bg);font-weight:600;font-size:16px;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.985)}
.btn.ghost{background:transparent;color:#fff;border:1px solid var(--line)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.tag{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 14px;border:1px solid var(--line);border-radius:8px;font-size:14px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 18px;border:1px solid var(--line);border-radius:100px;font-size:14px;color:var(--muted);transition:all .2s}
.chip.on{background:#fff;color:var(--bg);border-color:#fff;font-weight:600}
.field{display:block;margin-bottom:16px}
.field span{display:block;font-size:12px;color:var(--muted);letter-spacing:.06em;margin-bottom:8px}
.field input{width:100%;height:52px;border-radius:12px;border:1px solid var(--line);background:transparent;color:#fff;padding:0 16px;font:inherit;font-size:16px;caret-color:#fff}
.field input:focus{outline:none;border-color:#fff}
.search{display:flex;align-items:center;gap:10px;height:48px;margin:0 16px 16px;border:1px solid var(--line);border-radius:100px;padding:0 18px;color:var(--muted)}
.search input{flex:1;background:none;border:0;color:#fff;font:inherit;font-size:15px;outline:none}

/* cards */
.hscroll{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 16px}
.hscroll::-webkit-scrollbar{display:none}
.feat{flex:none;width:340px;display:flex;gap:20px;align-items:center;scroll-snap-align:start;text-align:left}
.feat .ph{width:185px;height:300px;border-radius:16px;overflow:hidden;flex:none}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.22,1,.36,1)}
.card{flex:none;width:295px;border:1px solid var(--soft);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:16px;scroll-snap-align:start;text-align:left}
.card .ph{height:240px;border-radius:10px;overflow:hidden}
.card:hover .ph img,.feat:hover .ph img,.row:hover .ph img{transform:scale(1.04)}
.row{display:flex;gap:14px;align-items:center;width:100%;padding:12px 0;border-bottom:1px solid #2a2a2e;text-align:left}
.row .ph{width:92px;height:92px;border-radius:12px;overflow:hidden;flex:none}
.ch{font-size:20px;font-weight:600;line-height:1.2;margin:0}
.sub{font-size:12px;font-weight:300;letter-spacing:.25em;color:var(--muted);text-transform:uppercase;margin:8px 0 0}
.panel{border:1px solid #2e2e33;background:var(--panel);border-radius:16px;padding:18px}

/* event */
.hero-img{position:relative;height:392px;margin-top:-72px}
.hero-img img{width:100%;height:100%;object-fit:cover;display:block}
.hero-img::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(22,22,25,.55),rgba(22,22,25,0) 30%,rgba(22,22,25,0) 70%,var(--bg))}
.back{position:absolute;left:16px;top:84px;z-index:2;width:48px;height:48px;border-radius:8px;background:rgba(22,22,25,.6);backdrop-filter:blur(8px);display:grid;place-items:center}
.tier{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:16px;border:1px solid var(--line);border-radius:14px;text-align:left;transition:border-color .2s,background .2s}
.tier+.tier{margin-top:10px}
.tier.on{border-color:#fff;background:rgba(255,255,255,.04)}
.tier.sold{opacity:.4;cursor:not-allowed}
.radio{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.tier.on .radio{border-color:#fff}
.tier.on .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:#fff}
.count{font-family:var(--display);font-size:20px;letter-spacing:.04em}
.qty{display:flex;align-items:center;gap:16px}
.qty button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center}
.qty b{font-family:var(--display);font-weight:400;font-size:20px;min-width:24px;text-align:center}
.sumrow{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-bottom:1px solid #2a2a2e;font-size:16px}
.pay{display:flex;align-items:center;gap:14px;width:100%;height:60px;padding:0 18px;border:1px solid var(--line);border-radius:14px;text-align:left;font-size:16px}
.pay+.pay{margin-top:10px}
.pay.on{border-color:#fff}
.steps{display:flex;gap:6px;margin:0 16px 22px}
.steps i{flex:1;height:3px;border-radius:3px;background:#2e2e33}
.steps i.on{background:#fff}

/* ticket */
.ticket{margin:0 16px;border-radius:20px;background:#fff;color:var(--bg);padding:22px;position:relative}
.ticket .qr{width:100%;aspect-ratio:1;display:block;image-rendering:pixelated;border-radius:8px}
.ticket .cut{height:0;border-top:2px dashed #d9d9dc;margin:18px -22px;position:relative}
.ticket .cut::before,.ticket .cut::after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--bg)}
.ticket .cut::before{left:-12px}.ticket .cut::after{right:-12px}
.tk{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.tk span{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6C6C6C}
.tk b{font-weight:600;font-size:15px}
.tabs{display:flex;gap:8px;padding:0 16px 20px}

/* owner */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.kpi{border:1px solid #2e2e33;border-radius:16px;padding:16px;background:var(--panel)}
.kpi.wide{grid-column:1/-1}
.kpi small{display:block;font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.kpi strong{display:block;font-family:var(--display);font-weight:400;font-size:30px;margin-top:10px;font-variant-numeric:tabular-nums}
.kpi .delta{font-size:13px;color:var(--muted);margin-top:6px}
.bars{display:flex;flex-direction:column;gap:14px}
.bar{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.bar .track{grid-column:1/-1;height:8px;border-radius:8px;background:#2a2a2e;overflow:hidden}
.bar .fill{height:100%;border-radius:8px;background:#fff;transform-origin:left;animation:grow .9s cubic-bezier(.22,1,.36,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.cols{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px}
.cols div{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;font-size:11px;color:var(--muted)}
.cols i{flex:none;display:block;width:100%;border-radius:6px 6px 2px 2px;background:#fff;transform-origin:bottom;animation:rise .8s cubic-bezier(.22,1,.36,1) both}
.cols div.lo i{background:#55555b}
@keyframes rise{from{transform:scaleY(0)}}
.prog{height:6px;border-radius:6px;background:#2a2a2e;margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:#fff;border-radius:6px}

/* scanner */
.scan{position:relative;margin:0 16px;height:420px;border-radius:20px;overflow:hidden}
.scan img{width:100%;height:100%;object-fit:cover;filter:brightness(.6)}
.scan .frame{position:absolute;left:50%;top:50%;width:220px;height:220px;transform:translate(-50%,-50%)}
.scan .frame b{position:absolute;width:42px;height:42px;border:3px solid #fff}
.scan .frame b:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.scan .frame b:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
.scan .frame b:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 14px}
.scan .frame b:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 14px 0}
.scan .line{position:absolute;left:12px;right:12px;height:2px;background:#fff;box-shadow:0 0 18px #fff;animation:sweep 1.8s ease-in-out infinite alternate}
@keyframes sweep{from{top:14px}to{top:204px}}
.ok{position:absolute;inset:0;display:grid;place-items:center;background:rgba(22,22,25,.72);backdrop-filter:blur(4px);animation:enter .3s ease both}
.okmark{width:84px;height:84px;border-radius:50%;background:#fff;color:var(--bg);display:grid;place-items:center;margin:0 auto 14px}

/* menu sheet */
.menu{position:absolute;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding:44px 16px 24px;animation:enter .3s cubic-bezier(.22,1,.36,1)}
.embed .menu{padding-top:0}
.menu nav{display:flex;flex-direction:column;margin-top:18px}
.menu nav button{font-family:var(--display);font-size:28px;text-align:left;padding:14px 0;border-bottom:1px solid #2a2a2e;display:flex;justify-content:space-between;align-items:center}
.menu .grp{font-size:12px;letter-spacing:.25em;color:var(--muted);text-transform:uppercase;margin:26px 0 4px}
.toast{position:absolute;left:16px;right:16px;bottom:24px;z-index:50;background:#fff;color:var(--bg);border-radius:14px;padding:14px 16px;font-weight:600;font-size:14px;display:flex;gap:10px;align-items:center;animation:enter .3s ease both}
.foot{margin-top:64px;padding:28px 16px 40px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px 28px;color:var(--muted);font-size:14px}
.foot b{color:#fff;font-weight:400}
.spacer{height:28px}

/* ================= desktop ================= */
.desk .scroller{padding-top:0}
.dwrap{max-width:1440px;margin:0 auto;padding:0 64px;box-sizing:border-box}
.dhdr{position:sticky;top:0;z-index:20;background:rgba(22,22,25,.92);backdrop-filter:blur(10px);border-bottom:1px solid #222226}
.dhdr-in{height:92px;display:flex;align-items:center;justify-content:space-between}
.desk .logo{font-size:25px}
.dnav{display:flex;align-items:center;gap:40px}
.dnav>button:not(.pill){font-size:16px;color:#BBBBBB;transition:color .2s}
.dnav>button:not(.pill):hover,.dnav>button.on{color:#fff}
.pill{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 28px;border-radius:40px;background:#fff;color:var(--bg);font-weight:700;font-size:16px;white-space:nowrap}
.pill.ghost{background:transparent;color:#BBBBBB;border:1px solid var(--line);font-weight:400}
.pill.ghost:hover{color:#fff;border-color:#fff}
.dnav .pill+.pill{margin-left:-16px}
.dd1{font-family:var(--display);font-weight:400;font-size:clamp(96px,10vw,160px);line-height:.98;margin:0}
.dd2{font-family:var(--display);font-weight:400;font-size:56px;line-height:1.05;margin:0}
.dhero{position:relative;min-height:760px;display:flex;align-items:center;overflow:hidden}
.dhero-img{position:absolute;top:40px;right:0;bottom:40px;width:62%}
.dhero-img img{width:100%;height:100%;object-fit:cover;display:block}
.dhero-img::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg),rgba(22,22,25,.2) 45%,rgba(22,22,25,0)),linear-gradient(0deg,rgba(0,0,0,.25),rgba(0,0,0,.25))}
.dhero-copy{position:relative;z-index:1;width:100%}
.dfeat{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1fr);gap:96px;align-items:center;padding-top:96px}
.dfeat .ph{aspect-ratio:706/840;border-radius:20px;overflow:hidden}
.drow-head{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:40px}
.dgrid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.dgrid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:40px}
.dcard{display:flex;flex-direction:column;gap:22px;border:1px solid var(--line);border-radius:24px;padding:24px;text-align:left;transition:border-color .25s}
.dcard:hover{border-color:#8a8a8f}
.dcard .ph{aspect-ratio:1/1;border-radius:14px;overflow:hidden}
.dcard:hover .ph img{transform:scale(1.04)}
.dcard-body{flex:1}
.dpartner{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:96px;align-items:center;padding-top:140px}
.dpartner .ph{aspect-ratio:4/3;border-radius:20px;overflow:hidden}
.dfilters{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:36px}
.devent{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr)}
.devent-img{position:sticky;top:92px;height:calc(100vh - 92px);min-height:560px}
.devent-img img{width:100%;height:100%;object-fit:cover;display:block}
.devent-body{padding:72px 64px 40px 96px;max-width:860px}
.drel{display:flex;gap:16px;align-items:stretch;margin-top:40px}
.counter{width:190px;flex:none;border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.dwhen{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:24px 0;border-bottom:1px solid #2a2a2e}
.dcol{max-width:620px;margin:0 auto;padding-bottom:40px}
.desk .dcol .ticket{margin:0 auto;max-width:420px}
.desk .dcol .tabs{justify-content:center}
.dash{display:grid;grid-template-columns:300px minmax(0,1fr);gap:48px;padding-top:48px;align-items:start}
.dside{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;position:sticky;top:120px}
.dside button{text-align:left;padding:22px 24px;font-size:20px;color:#8f8f94;border-top:1px solid var(--line);transition:background .2s,color .2s}
.dside button:first-child{border-top:0}
.dside button:hover:not([disabled]){color:#fff}
.dside button.on{background:#BBBBBB;color:#161619;font-weight:700}
.dside button[disabled]{cursor:default;opacity:.55}
.dkpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.dkpis .kpi{padding:24px 28px;border-radius:10px;background:transparent;border-color:var(--line)}
.dkpis .kpi strong{font-family:var(--body);font-weight:400;font-size:44px}
.kpi.light{background:#fff;color:var(--bg);border-color:#fff}
.kpi.light small,.kpi.light .delta{color:#454547}
.dpanels{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-top:24px}
.dpanels .panel{background:transparent;border-color:var(--line);border-radius:10px;padding:28px}
.dmain .scan{margin:0}.dmain .pad{padding:0}
.dfoot{margin-top:120px;border-top:1px solid var(--line);padding:40px 0 48px;font-size:18px}
.dfoot-row{display:flex;justify-content:space-between;gap:24px}
.dfoot-row span{display:flex;gap:44px}
.dfoot-row b{font-weight:400}
.dfoot-row.muted{color:#8f8f94;margin-top:64px;font-size:15px}
@media (max-width:1200px){.dgrid4{grid-template-columns:repeat(2,minmax(0,1fr))}.dash{grid-template-columns:240px minmax(0,1fr)}.devent-body{padding-left:56px}}
</style>
</head>
<body>
<div class="stage">
  <aside class="aside" aria-label="About this prototype">
    <h1>TikTaac</h1>
    <p>Clickable demo of the event platform. Two sides of the same product:</p>
    <ol>
      <li>Guests discover an event, choose a ticket release and pay.</li>
      <li>The ticket lives in the app as a QR code, next to a bar wallet.</li>
      <li>Venue owners track sales and scan guests in at the door.</li>
    </ol>
    <div class="role" role="group" aria-label="Switch side">
      <button class="chipbtn" data-role="guest">Guest</button>
      <button class="chipbtn" data-role="owner">Venue owner</button>
    </div>
  </aside>
  <div class="devwrap"><div class="device">
    <div class="screen" id="screen">
      <div class="status" aria-hidden="true"><span>9:41</span><span class="ind">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>

<script>

  // scale the phone so the whole device fits the window

  fit();
  window.addEventListener('resize', fit);

  const I = {

    arrow:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"/></svg>',
    star:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9z"/></svg>',
    minus:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14"/></svg>',

    check:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
    card:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19"/></svg>',
    phone:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M10.5 18.5h3" stroke-linecap="round"/></svg>',
    pin:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>'
  };
  const LOGO = '<svg width="16" height="15" viewBox="0 0 16 15" fill="#fff" aria-hidden="true"><rect x="0" y="4" width="2" height="7" rx="1"/><rect x="3" y="2" width="2" height="11" rx="1"/><rect x="6" y="4" width="2" height="2" rx="1"/><rect x="6" y="7" width="2" height="9" rx="1"/><rect x="9" y="2" width="2" height="6" rx="1"/><rect x="9" y="9" width="2" height="2" rx="1"/><rect x="11.5" y="0" width="2" height="13" rx="1"/><rect x="14" y="3" width="2" height="7" rx="1"/></svg>';

  /* data, taken from the Figma screens */
  const EVENTS = [
    { id:'soiree', name:'Exclusive Celestial Soirée', venue:'Marquee New York', city:'NY', date:'Fri / Dec 24 / 9:00 pm', type:'Party', rating:'9.8', img:'crew.jpg', from:46.2 },
    { id:'lastparty', name:'The Last Party', venue:'Marquee New York', city:'NY', date:'Sat / Dec 30 / 11:00 pm', type:'Club night', rating:'9.6', img:'stage.jpg', from:38 },
    { id:'neon', name:'Neon Glow Party', venue:'Lavo Rooftop', city:'NY', date:'Thu / Dec 21 / 10:00 pm', type:'Party', rating:'9.4', img:'neonface.jpg', from:29 },

  const header = (title) => `

  const V = {
    home(){

      </div>
      <div class="sec"><h2 class="d2">Upcoming events</h2></div>
      <div class="hscroll" aria-label="Upcoming events">
        ${up.map(e=>`
          <button class="card" data-go="event" data-ev="${e.id}">
            <div class="ph"><img src="${im(e.img)}" alt=""></div>
            <div><p class="ch">${e.name}</p><p class="sub">${e.date}</p><p class="sub" style="margin-top:6px">${e.venue}</p></div>
            <span class="btn" style="height:48px">From ${money(e.from)}</span>
          </button>`).join('')}
      </div>
      <div class="sec">
        <h2 class="d2" style="margin-bottom:8px">Become a partner</h2>
        <p class="p" style="margin-bottom:28px">We’re proud to work with a global network of promoters, venues and artists</p>
        <button class="btn ghost" data-act="role" data-role="owner">Open the owner dashboard</button>
      </div>` + footer();
    },

    events(){
      const types = ['All','Party','Club night','Concert','Gala','Lounge'];
      const q = S.q.trim().toLowerCase();
      const list = EVENTS.filter(e => (S.filter==='All' || e.type===S.filter) && (!q || (e.name+e.venue).toLowerCase().includes(q)));
      return header() + `
      <div class="pad" style="padding-top:8px;margin-bottom:20px"><h1 class="d2">Events</h1></div>
      <label class="search">${I.search}<input id="q" type="search" placeholder="Search events or venues" value="${S.q.replace(/"/g,'&quot;')}" aria-label="Search events or venues"></label>

        ${list.length ? list.map(e=>`
          <button class="row" data-go="event" data-ev="${e.id}">

    },

    event(){
      const e = EVENTS.find(x=>x.id===S.ev) || EVENTS[0];
      const tier = TIERS.find(t=>t.id===S.tier);
      return header() + `
      <div class="hero-img"><img src="${im(e.img)}" alt="${e.name}"><button class="back" data-go="events" aria-label="Back to events">${I.back}</button></div>
      <div class="pad" style="margin-top:-30px;position:relative">
        <div style="display:flex;gap:8px;margin-bottom:24px"><span class="tag">${e.type}</span><span class="tag">${e.city}</span><span class="tag">${I.star}${e.rating}</span></div>

        <p class="p" style="margin-top:32px">${e.venue}</p>
        <p class="p16" style="margin-top:8px">${e.date}</p>
      </div>
      <div class="sec" style="padding-top:28px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px"><p class="meta">Choose a release</p><p class="p">Release ends in <span class="count" id="cd" style="font-size:14px;color:#fff">02:35:47</span></p></div>
        <div role="radiogroup" aria-label="Ticket release">
        ${TIERS.map(t=>`
          <button class="tier ${S.tier===t.id?'on':''} ${t.left?'':'sold'}" role="radio" aria-checked="${S.tier===t.id}" ${t.left?`data-tier="${t.id}"`:'aria-disabled="true"'}>
            <span style="display:flex;gap:14px;align-items:center"><span class="radio"></span><span><span class="ch" style="font-size:18px;display:block">${t.name}</span><span class="p" style="display:block;margin-top:4px">${t.note}</span></span></span>

      <div class="sec"><h2 class="d2">Lineup</h2>
        <div style="display:flex;gap:8px;margin-bottom:16px">${['djgirl','turntable','neonblue'].map(n=>`<div class="ph" style="width:96px;height:96px;border-radius:12px;overflow:hidden"><img src="${im(n+'.jpg')}" alt=""></div>`).join('')}</div>

        <div class="ph" style="height:200px;border-radius:16px;overflow:hidden;margin-top:20px"><img src="${im('map.jpg')}" alt="Map of the venue location" style="filter:grayscale(1) invert(.92) contrast(.9)"></div>

      </div>` + footer();
    },

    buy(){
      const e = EVENTS.find(x=>x.id===S.ev) || EVENTS[0];

          <h1 class="d2" style="font-size:36px;margin-bottom:12px">Buy tickets</h1>

            <label class="field"><span>FIRST NAME</span><input required autocomplete="given-name" value="Jonathan"></label>
            <label class="field"><span>LAST NAME</span><input required autocomplete="family-name" value="Williamson"></label>

      if (S.step===2) return header() + `

          <div class="sumrow"><span>${t.name}</span><span class="qty"><button data-qty="-1" aria-label="One ticket less" ${S.qty<=1?'disabled style="opacity:.35"':''}>${I.minus}</button><b aria-live="polite">${S.qty}</b><button data-qty="1" aria-label="One ticket more" ${S.qty>=6?'disabled style="opacity:.35"':''}>${I.plus}</button></span></div>
          <div class="sumrow"><span class="p16">${S.qty} ticket${S.qty>1?'s':''} × ${money(t.price)}</span><span class="d3" style="font-size:20px">${money(total)}</span></div>

      return header() + `

    tickets(){

  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.menu) { S.menu = false; render(false); } });

  // live countdown on the event page
  let left = 2*3600 + 35*60 + 47;
  setInterval(() => { left = left > 0 ? left - 1 : 0; const el = document.getElementById('cd'); if (el) { const h = String(Math.floor(left/3600)).padStart(2,'0'), m = String(Math.floor(left%3600/60)).padStart(2,'0'), x = String(left%60).padStart(2,'0'); el.textContent = h+':'+m+':'+x; } }, 1000);

  render(true);
})();
</script>
</body>
</html>
